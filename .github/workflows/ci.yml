name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check api/_http.js
          node --check api/game/start.js
          node --check api/game/answer.js
          node --check db/client.mjs
          node --check scripts/seed-db.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
